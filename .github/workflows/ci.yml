name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-demo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run benchmark demo
        run: python benchmark/run_benchmark.py --limit 3 --runs 1
      - name: Enforce regression gates
        run: python analysis/compare_results.py
